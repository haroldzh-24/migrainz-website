# Batch 21 (roadmap 0.7 / 4.4; Harold, 2026-11-12: yes). Runs the non-browser part of `npm run check` on every pull
# request and every push to main. Free for public repositories (GitHub Actions minutes cost nothing there).
#
# - Needs NO secrets and loads no .env file: none is committed (.gitignore), and `npm run build` compiles offline with
#   build-only placeholders (scripts/build-env.mjs); no database, Blob store, Vercel or Neon is contacted. Do not add
#   secrets or env vars here: that would be a change to secrets (AGENTS.md "Ask Harold first").
# - The browser steps (regression, equipment-navigation, equipment-browser, viewer-pinch, window-pass) stay local:
#   they need Chrome, a seeded dev fixture server and about 15 minutes on a 2-core machine, and their timing checks
#   (for example the Watcher jitter's ~90 ms snap-back) are flaky on loaded shared runners. Run them with
#   `npm run check` before every commit, as AGENTS.md says.
# - Node: package.json has no "engines" field and the repo has no .nvmrc; 22.23.4 is the version the local checks run
#   on (README: Node 20.9+; the Payload 3.92 upgrade will need ^22.23.4 or >=24.22.1). Update it with that upgrade.
# - Pushing this file needs a GitHub token with the `workflow` scope (a plain `repo` token is refused for files under
#   .github/workflows/). Every push to main is still a live deploy and needs Harold's OK.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # The step names are those of scripts/check-all.mjs (`npm run check -- --list`). The log is also saved under
      # test-results/ on the runner (not uploaded).
      - run: npm run check -- --only typecheck,build,security-headers,fixture-env,push-guard,production-guard,blob-storage,equipment,migration,home-graphics,graphics-mode
